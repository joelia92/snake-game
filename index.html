<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Juego de la Serpiente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 100, 0.5);
        }

        .game-container {
            background: #0f0f1a;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.2);
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .stats span {
            background: #1e2a3a;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .stats .value {
            color: #00ff64;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #00ff64;
            border-radius: 8px;
            background: #000;
            max-width: 100%;
        }

        .controls {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .controls kbd {
            background: #2a3a4a;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #4a5a6a;
        }

        #gameOver {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        #gameOver.show {
            display: flex;
        }

        #gameOver h2 {
            font-size: 3rem;
            color: #ff4444;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        #gameOver button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #00ff64;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #gameOver button:hover {
            transform: scale(1.1);
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-screen h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .start-screen p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        .start-screen button {
            padding: 15px 40px;
            font-size: 1.3rem;
            background: #00ff64;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .start-screen button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <h1>🐍 Juego de la Serpiente</h1>
        <p>Usa las flechas del teclado para mover la serpiente</p>
        <button id="startBtn">▶ Iniciar Juego</button>
    </div>

    <div id="gameOver">
        <h2>💀 Game Over</h2>
        <p>Puntuación: <span id="finalScore">0</span></p>
        <button id="restartBtn">🔄 Jugar de Nuevo</button>
    </div>

    <h1>🐍 Juego de la Serpiente</h1>

    <div class="game-container">
        <div class="stats">
            <span>🍎 Puntuación: <span id="score" class="value">0</span></span>
            <span>🏆 Mejor: <span id="bestScore" class="value">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            Controles: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> o <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const GAME_SPEED = 100;

        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let bestScore = localStorage.getItem('snakeBestScore') || 0;
        let gameRunning = false;
        let gameLoop = null;

        bestScoreEl.textContent = bestScore;

        function init() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            score = 0;
            scoreEl.textContent = score;
            dx = 1;
            dy = 0;
            generateFood();
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * TILE_COUNT),
                y: Math.floor(Math.random() * TILE_COUNT)
            };
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    break;
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff4444';
            ctx.fillRect(food.x * GRID_SIZE, food.y * GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? '#00ff64' : '#00cc52';
                ctx.fillRect(snake[i].x * GRID_SIZE, snake[i].y * GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);
            }
        }

        function move() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBestScore', bestScore);
                bestScoreEl.textContent = bestScore;
            }
            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');
        }

        function changeDirection(event) {
            const key = event.key.toLowerCase();
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (key === 'arrowup' || key === 'w') {
                if (!goingDown) { dx = 0; dy = -1; }
            }
            if (key === 'arrowdown' || key === 's') {
                if (!goingUp) { dx = 0; dy = 1; }
            }
            if (key === 'arrowleft' || key === 'a') {
                if (!goingRight) { dx = -1; dy = 0; }
            }
            if (key === 'arrowright' || key === 'd') {
                if (!goingLeft) { dx = 1; dy = 0; }
            }
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverEl.classList.remove('show');
            init();
            draw();
            gameRunning = true;
            gameLoop = setInterval(move, GAME_SPEED);
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
                e.preventDefault();
                changeDirection(e);
            }
        });
    </script>
</body>
</html>
