<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Juego 3D - Serpiente Cartoon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 100, 0.5);
        }

        .game-container {
            background: #0f0f1a;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.2);
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .stats span {
            background: #1e2a3a;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .stats .value {
            color: #00ff64;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #00ff64;
            border-radius: 8px;
            background: #000;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(0, 255, 100, 0.1);
        }

        .controls {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .controls kbd {
            background: #2a3a4a;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #4a5a6a;
        }

        #gameOver {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        #gameOver.show {
            display: flex;
        }

        #gameOver h2 {
            font-size: 3rem;
            color: #ff4444;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        #gameOver button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #00ff64;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #gameOver button:hover {
            transform: scale(1.1);
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-screen h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .start-screen p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        .start-screen button {
            padding: 15px 40px;
            font-size: 1.3rem;
            background: #00ff64;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .start-screen button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <h1>🐍 Juego 3D Serpiente</h1>
        <p>Usa flechas o WASD para mover la serpiente cartoon</p>
        <button id="startBtn">▶ Iniciar Juego</button>
    </div>

    <div id="gameOver">
        <h2>💀 Game Over</h2>
        <p>Puntuación: <span id="finalScore">0</span></p>
        <button id="restartBtn">🔄 Jugar de Nuevo</button>
    </div>

    <h1>🐍 Juego 3D Serpiente</h1>

    <div class="game-container">
        <div class="stats">
            <span>🍎 Puntuación: <span id="score" class="value">0</span></span>
            <span>🏆 Mejor: <span id="bestScore" class="value">0</span></span>
        </div>
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div class="controls">
            <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> o <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');

        const TILE = 25;
        const COLS = Math.floor(canvas.width / TILE);
        const ROWS = Math.floor(canvas.height / TILE);
        const SPEED = 130;

        let snake = [];
        let food = null;
        let dirX = 1, dirY = 0;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snakeBest') || '0');
        let running = false;
        let loop = null;
        let time = 0;

        bestScoreEl.textContent = bestScore;

        function init() {
            snake = [
                { x: Math.floor(COLS/2), y: Math.floor(ROWS/2) },
                { x: Math.floor(COLS/2)-1, y: Math.floor(ROWS/2) },
                { x: Math.floor(COLS/2)-2, y: Math.floor(ROWS/2) }
            ];
            score = 0;
            scoreEl.textContent = score;
            dirX = 1; dirY = 0;
            placeFood();
        }

        function placeFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function draw() {
            // Fondo degradado
            const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(1, '#0d0d1a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sombra de profundidad alrededor del tablero
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(2, 2, canvas.width - 4, canvas.height - 4);

            // Tablero base - tiles con profundidad 3D
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const px = x * TILE;
                    const py = y * TILE;
                    
                    // Sombra ligera en cada tile
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.fillRect(px + 2, py + 2, TILE, 2);
                    ctx.fillRect(px + 2, py + 2, 2, TILE);
                    
                    // Tile principal
                    const depth = (x + y) % 2 === 0 ? 'rgba(35, 45, 70, 0.5)' : 'rgba(30, 40, 60, 0.5)';
                    ctx.fillStyle = depth;
                    ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
                    
                    // Borde superior para efecto 3D
                    ctx.fillStyle = 'rgba(80, 100, 140, 0.15)';
                    ctx.fillRect(px + 2, py + 2, TILE - 4, 3);
                }
            }

            // Borde exterior 3D
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, canvas.height - 4, canvas.width, 4);
            ctx.fillRect(canvas.width - 4, 0, 4, canvas.height);

            // === MANZANA 3D ===
            if (food) {
                const fx = food.x * TILE + TILE/2;
                const fy = food.y * TILE + TILE/2;
                const s = TILE * 0.35;
                
                // Sombra
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.ellipse(fx + 3, fy + 4, s*0.9, s*0.3, 0, 0, Math.PI*2);
                ctx.fill();
                
                // Manzana con gradiente 3D
                const grad = ctx.createRadialGradient(fx - s*0.25, fy - s*0.25, 0, fx, fy, s);
                grad.addColorStop(0, '#ff7979');
                grad.addColorStop(0.6, '#ee4444');
                grad.addColorStop(1, '#bb2222');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(fx, fy, s, 0, Math.PI * 2);
                ctx.fill();
                
                // Borde 3Dight
                ctx.strokeStyle = '#ff8888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(fx - 2, fy - 2, s - 1, -Math.PI*0.8, -Math.PI*0.2);
                ctx.stroke();
                
                // Brillo
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(fx - s*0.3, fy - s*0.3, s*0.2, 0, Math.PI*2);
                ctx.fill();
                
                // Hojita
                ctx.fillStyle = '#4a7c3f';
                ctx.beginPath();
                ctx.arc(fx + s*0.2, fy - s*0.6, s*0.15, 0, Math.PI*2);
                ctx.fill();
            }

            // === SERPIENTE 3D ===
            for (let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const px = seg.x * TILE + TILE/2;
                const py = seg.y * TILE + TILE/2;
                const isHead = i === 0;
                const t = i / Math.max(snake.length - 1, 1);
                
                // Sombra bajo cada segmento
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(px + 3, py + 4, TILE*0.35, TILE*0.12, 0, 0, Math.PI*2);
                ctx.fill();
                
                if (isHead) {
                    // === CABEZA - forma tubular alargada, estilo cartoon ===
                    const headW = TILE * 0.7;
                    const headH = TILE * 0.55;
                    const wiggleX = Math.sin(time * 0.15) * 2;
                    const wiggleY = Math.cos(time * 0.12) * 1.5;
                    
                    // Cuerpo principal
                    const headGrad = ctx.createLinearGradient(px - headW/2, py, px + headW/2, py);
                    headGrad.addColorStop(0, '#f5c6a0');
                    headGrad.addColorStop(0.5, '#e8b89a');
                    headGrad.addColorStop(1, '#d4a080');
                    
                    ctx.fillStyle = headGrad;
                    ctx.beginPath();
                    ctx.ellipse(px + wiggleX, py + wiggleY, headW, headH, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Borde 3D
                    ctx.strokeStyle = '#c49070';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(px + wiggleX, py + wiggleY, headW, headH, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Brillo superior
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.ellipse(px + wiggleX - headW*0.2, py + wiggleY - headH*0.25, headW*0.4, headH*0.25, 0, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Ojitos grandes y chistosos
                    ctx.fillStyle = '#2d1810';
                    ctx.beginPath();
                    ctx.arc(px + wiggleX - headW*0.25, py + wiggleY - headH*0.2, 3.5, 0, Math.PI*2);
                    ctx.arc(px + wiggleX + headW*0.25, py + wiggleY - headH*0.2, 3.5, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Brillo ojitos
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(px + wiggleX - headW*0.25 - 1, py + wiggleY - headH*0.2 - 1, 1.5, 0, Math.PI*2);
                    ctx.arc(px + wiggleX + headW*0.25 - 1, py + wiggleY - headH*0.2 - 1, 1.5, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Boca chistosa
                    ctx.strokeStyle = '#8b5a3c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(px + wiggleX, py + wiggleY + headH*0.15, headW*0.25, 0.3, Math.PI - 0.3);
                    ctx.stroke();
                    
                    // Lengua chistosa
                    ctx.fillStyle = '#ff6b6b';
                    ctx.beginPath();
                    ctx.moveTo(px + wiggleX + headW*0.1, py + wiggleY + headH*0.15);
                    ctx.lineTo(px + wiggleX + headW*0.35, py + wiggleY + headH*0.2 + 5);
                    ctx.lineTo(px + wiggleX + headW*0.1, py + wiggleY + headH*0.15 + 3);
                    ctx.fill();
                    
                } else {
                    // === CUERPO - segmentos tubulares ===
                    const segW = TILE * (0.55 - t * 0.1);
                    const segH = TILE * (0.5 - t * 0.08);
                    
                    const wiggleX = Math.sin(time * 0.1 + i * 0.3) * 1.5;
                    const wiggleY = Math.cos(time * 0.08 + i * 0.2) * 1;
                    
                    // Color de carne más claro cerca de la cabeza
                    const hueShift = t * 15;
                    const color1 = `hsl(25, ${65 - hueShift}%, ${68 - t * 8}%)`;
                    const color2 = `hsl(18, ${55 - hueShift}%, ${52 - t * 10}%)`;
                    
                    const segGrad = ctx.createRadialGradient(
                        px - segW*0.2 + wiggleX, py - segH*0.2 + wiggleY, 0,
                        px + wiggleX, py + wiggleY, segW
                    );
                    segGrad.addColorStop(0, color1);
                    segGrad.addColorStop(1, color2);
                    
                    ctx.fillStyle = segGrad;
                    ctx.beginPath();
                    ctx.ellipse(px + wiggleX, py + wiggleY, segW, segH, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Borde
                    ctx.strokeStyle = `rgba(160, 100, 60, ${0.4 - t * 0.2})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(px + wiggleX, py + wiggleY, segW, segH, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            
            // === BOLITAS DE ABAJO (carne, animadas) ===
            if (snake.length >= 2) {
                const tail = snake[snake.length - 1];
                const px = tail.x * TILE + TILE/2;
                const py = tail.y * TILE + TILE/2;
                const t = (snake.length - 1) / Math.max(snake.length - 1, 1);
                
                // Solo visible si la cola esta en la parte inferior de la serpiente
                if (t > 0.5) {
                    const bounce = Math.sin(time * 0.1 + t * 3) * 4;
                    const wobble = Math.sin(time * 0.15 + t * 2) * 2;
                    
                    const ballY = py + TILE * 0.4 + bounce;
                    const ballX1 = px - TILE * 0.2 + wobble;
                    const ballX2 = px + TILE * 0.2 - wobble;
                    const ballR = TILE * 0.12 * (1 + bounce * 0.03);
                    
                    // Bolitas con gradiente carne
                    const ballGrad = ctx.createRadialGradient(
                        ballX1 - ballR*0.3, ballY - ballR*0.3, 0,
                        ballX1, ballY, ballR
                    );
                    ballGrad.addColorStop(0, '#f5c8a8');
                    ballGrad.addColorStop(0.6, '#e8b89a');
                    ballGrad.addColorStop(1, '#c4866a');
                    
                    drawBall(ballX1, ballY, ballR, ballGrad);
                    
                    const ballGrad2 = ctx.createRadialGradient(
                        ballX2 - ballR*0.3, ballY - ballR*0.3, 0,
                        ballX2, ballY, ballR
                    );
                    ballGrad2.addColorStop(0, '#f5c8a8');
                    ballGrad2.addColorStop(0.6, '#e8b89a');
                    ballGrad2.addColorStop(1, '#c4866a');
                    
                    drawBall(ballX2, ballY, ballR, ballGrad2);
                }
            }
        }

        function drawBall(x, y, r, grad) {
            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(x + 2, y + r*0.8, r*0.7, r*0.25, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Bola
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            
            // Borde
            ctx.strokeStyle = 'rgba(140, 90, 60, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.stroke();
            
            // Brillo
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(x - r*0.25, y - r*0.3, r*0.25, 0, Math.PI*2);
            ctx.fill();
        }

        function move() {
            const head = { x: snake[0].x + dirX, y: snake[0].y + dirY };
            
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
            
            time++;
            draw();
        }

        function gameOver() {
            running = false;
            clearInterval(loop);
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBest', bestScore);
                bestScoreEl.textContent = bestScore;
            }
            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');
        }

        function changeDir(key) {
            const k = key.toLowerCase();
            const up = dirY === -1, down = dirY === 1, right = dirX === 1, left = dirX === -1;
            
            if (k === 'arrowup' || k === 'w') { if (!down) { dirX = 0; dirY = -1; } }
            if (k === 'arrowdown' || k === 's') { if (!up) { dirX = 0; dirY = 1; } }
            if (k === 'arrowleft' || k === 'a') { if (!right) { dirX = -1; dirY = 0; } }
            if (k === 'arrowright' || k === 'd') { if (!left) { dirX = 1; dirY = 0; } }
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverEl.classList.remove('show');
            init();
            time = 0;
            draw();
            running = true;
            loop = setInterval(move, SPEED);
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (!running) return;
            if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) {
                e.preventDefault();
                changeDir(k);
            }
        });
    </script>
</body>
</html>
